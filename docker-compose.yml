name: pointhub-backend-2

services:
  app:
    build: .
    container_name: pointhub-backend-2
    environment:
      PORT: ${PORT:-3037}
      EV_HUB_BRIDGE_URL: ${EV_HUB_BRIDGE_URL}
      EV_HUB_ID_TAG: ${EV_HUB_ID_TAG:-OUTSIDE}
      EV_HUB_PLATFORM_KEY: ${EV_HUB_PLATFORM_KEY:-}
    ports:
      - "${PORT:-3037}:${PORT:-3037}"
    networks:
      - virtual-network
    restart: unless-stopped

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: virtual-ocpp-cloudflare
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN}
    networks:
      - virtual-network
    restart: unless-stopped
    depends_on:
      - app

networks:
  virtual-network:
    driver: bridge
